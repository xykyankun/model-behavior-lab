[metadata]
name = model-behavior-lab
version = 0.2.0
description = Reproducible experiments about observable model behavior
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
python_requires = >=3.9

[options.packages.find]
include = behavior_lab*

[options.package_data]
behavior_lab = sources.json

[options.entry_points]
console_scripts =
    behavior-lab = behavior_lab.__main__:main
